<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mobility Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased selection:bg-amber-500 selection:text-white"
      x-data="mobilityApp()" x-init="initApp()">

  <!-- Top Status Bar -->
  <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3.5 flex items-center justify-between shadow-sm">
    <button x-show="mode === 'active'" @click="exitWorkout()" class="text-xs font-bold uppercase tracking-wider text-amber-400 hover:text-amber-300 transition flex items-center gap-1.5">
      <span>&larr;</span><span>Routines</span>
    </button>
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.6)]"></span>
      <h1 class="text-sm font-black tracking-wide text-slate-100 uppercase" x-text="headerTitle"></h1>
    </div>
    <span class="text-xs font-mono font-bold px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-amber-400/90" 
          x-text="mode === 'active' ? `${currentIndex + 1}/${activeList.length}` : 'Ready'"></span>
  </header>

  <!-- View 1: Routine Selector & Category Switcher -->
  <main x-show="mode === 'selector'" class="p-4 max-w-md mx-auto space-y-5 pb-12">
    <!-- Category Navigation Pill Bar -->
    <div class="p-1 rounded-2xl bg-slate-800/80 border border-slate-700/80 grid grid-cols-2 gap-1 shadow-inner">
      <button @click="activeTab = 'mobility'"
              class="py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-all duration-200"
              :class="activeTab === 'mobility' ? 'bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 shadow-md' : 'text-slate-400 hover:text-slate-200'">
        Mobility
      </button>
      <button @click="activeTab = 'calisthenics'"
              class="py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-all duration-200"
              :class="activeTab === 'calisthenics' ? 'bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 shadow-md' : 'text-slate-400 hover:text-slate-200'">
        Skills & Strength
      </button>
    </div>

    <!-- Header Description -->
    <div class="space-y-1.5 pt-1">
      <div class="inline-block px-2.5 py-0.5 rounded-full bg-amber-500/10 border border-amber-500/20 text-[11px] font-bold tracking-wider uppercase text-amber-400"
           x-text="activeTab === 'mobility' ? 'Joint Health & Splits' : 'Minimal Effective Dose (MED)'"></div>
      <h2 class="text-2xl font-black text-white tracking-tight"
          x-text="activeTab === 'mobility' ? 'Daily Mobility Routines' : 'Calisthenics Skill Protocols'"></h2>
      <p class="text-xs text-slate-400 leading-relaxed"
         x-text="activeTab === 'mobility' ? 'Select your daily split or regional flow.' : 'Targeting OAC, Planche, HSPU, and Muscle-Up foundations in 2–3 high-intensity sets.'"></p>
    </div>

    <!-- Routine Cards -->
    <div class="space-y-3">
      <template x-for="(routine, key) in filteredRoutines" :key="key">
        <div class="p-4 rounded-2xl bg-gradient-to-br from-slate-800/95 to-slate-800/60 border border-slate-700/80 hover:border-amber-500/40 transition-all duration-200 flex items-center justify-between shadow-sm hover:shadow-md group">
          <div class="space-y-1.5 pr-3">
            <h3 class="font-bold text-slate-100 text-sm leading-snug group-hover:text-amber-300 transition-colors" x-text="routine.name"></h3>
            <div class="flex items-center gap-2 text-xs text-slate-400">
              <span class="inline-flex items-center gap-1 text-teal-300/90 font-medium">
                <span class="w-1.5 h-1.5 rounded-full bg-teal-400"></span>
                <span x-text="`${routine.exercises.length} items`"></span>
              </span>
              <span>•</span>
              <span x-text="`~${routine.duration} mins`"></span>
            </div>
          </div>
          <button @click="startRoutine(key)" 
                  class="shrink-0 px-4 py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 text-xs font-black rounded-xl transition shadow-[0_4px_12px_rgba(245,158,11,0.25)] active:scale-95 uppercase tracking-wide">
            Start
          </button>
        </div>
      </template>
    </div>
  </main>

  <!-- View 2: Active Workout View -->
  <main x-show="mode === 'active'" class="p-4 max-w-md mx-auto flex flex-col justify-between min-h-[calc(100vh-4.5rem)] pb-8">
    <div class="space-y-4">
      <!-- Title & Biomechanical Tag -->
      <div class="space-y-1.5">
        <div class="flex items-center gap-2">
          <span class="px-2 py-0.5 rounded bg-amber-500/15 border border-amber-500/30 text-[10px] font-black uppercase tracking-widest text-amber-400" 
                x-text="currentEx.category || 'Target Focus'"></span>
          <span class="text-[11px] text-teal-400 font-medium" x-show="currentEx.target_joints?.length" x-text="currentEx.target_joints?.join(' • ')"></span>
        </div>
        <h2 class="text-2xl font-black text-white leading-snug" x-text="currentEx.branded_name"></h2>
        <p class="text-xs text-slate-400 italic" x-text="currentEx.biomechanical_name"></p>
      </div>

      <!-- Prescribed Volume Badge -->
      <div class="inline-flex items-center gap-2.5 px-3 py-1.5 rounded-xl bg-slate-800/80 border border-slate-700 text-xs font-mono text-slate-200 shadow-inner">
        <span class="font-bold text-amber-400" x-text="`${currentEx.sets} sets`"></span>
        <span class="text-slate-600">|</span>
        <span x-text="`${currentEx.reps} ${currentEx.reps_unit || 'reps'}`"></span>
        <template x-if="currentEx.hold_seconds > 0">
          <span class="px-1.5 py-0.2 rounded bg-teal-500/10 border border-teal-500/20 text-teal-300 font-semibold" x-text="`${currentEx.hold_seconds}s hold`"></span>
        </template>
      </div>

      <!-- Timer & Rep State UI -->
      <div class="relative overflow-hidden p-6 rounded-2xl bg-gradient-to-b from-slate-800/90 to-slate-800/50 border border-slate-700/80 flex flex-col items-center justify-center space-y-4 shadow-lg">
        <div class="absolute top-0 inset-x-0 h-1 bg-slate-700">
          <div class="h-full bg-gradient-to-r from-amber-500 to-amber-400 transition-all duration-300"
               :style="`width: ${targetTimer > 0 ? (timerVal / targetTimer) * 100 : 0}%`"></div>
        </div>

        <div class="text-5xl font-mono font-black tabular-nums tracking-tight drop-shadow-sm"
             :class="timerRunning ? 'text-amber-400' : 'text-slate-100'"
             x-text="formatTime(timerVal)"></div>

        <div class="flex items-center gap-2.5">
          <button @click="toggleTimer()" 
                  class="px-5 py-2.5 rounded-xl text-xs font-black transition active:scale-95 shadow-md uppercase tracking-wider"
                  :class="timerRunning ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30' : 'bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950'">
            <span x-text="timerRunning ? 'Pause' : (timerVal < targetTimer ? 'Resume' : 'Start Hold Timer')"></span>
          </button>
          <button @click="resetTimer()" class="px-3.5 py-2.5 rounded-xl bg-slate-700/80 text-slate-300 text-xs font-bold hover:bg-slate-600 active:scale-95 border border-slate-600 transition">
            Reset
          </button>
        </div>
      </div>

      <!-- Movement Execution Details -->
      <div class="space-y-3 pt-1">
        <div class="p-3.5 rounded-xl bg-slate-800/60 border border-slate-700/60 space-y-1.5">
          <div class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
            <h4 class="text-[11px] font-black uppercase tracking-wider text-slate-400">Starting Position</h4>
          </div>
          <p class="text-xs text-slate-300 leading-relaxed pl-3.5" x-text="currentEx.starting_position"></p>
        </div>

        <div class="p-3.5 rounded-xl bg-slate-800/60 border border-slate-700/60 space-y-2">
          <div class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-teal-400"></span>
            <h4 class="text-[11px] font-black uppercase tracking-wider text-slate-400">Movement Cues</h4>
          </div>
          <ul class="space-y-1.5 pl-1">
            <template x-for="(cue, i) in currentEx.movement_cues" :key="i">
              <li class="text-xs text-slate-300 flex items-start gap-2">
                <span class="text-teal-400 font-bold mt-0.5">•</span>
                <span x-text="cue"></span>
              </li>
            </template>
          </ul>
        </div>

        <div class="p-3.5 rounded-xl bg-slate-800/60 border border-slate-700/60 space-y-2" x-show="currentEx.common_faults?.length">
          <div class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>
            <h4 class="text-[11px] font-black uppercase tracking-wider text-rose-300/90">Common Faults</h4>
          </div>
          <ul class="space-y-1.5 pl-1">
            <template x-for="(fault, i) in currentEx.common_faults" :key="i">
              <li class="text-xs text-slate-400 flex items-start gap-2">
                <span class="text-rose-400 font-bold mt-0.5">&times;</span>
                <span x-text="fault"></span>
              </li>
            </template>
          </ul>
        </div>
      </div>
    </div>

    <!-- Navigation Controls -->
    <div class="flex items-center gap-3 pt-6 border-t border-slate-800">
      <button @click="prevExercise()" :disabled="currentIndex === 0"
              class="w-1/3 py-3 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-bold disabled:opacity-30 disabled:pointer-events-none active:scale-95 hover:bg-slate-750 transition">
        Previous
      </button>
      <button @click="nextExercise()"
              class="w-2/3 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 text-xs font-black uppercase tracking-wide active:scale-95 shadow-[0_4px_12px_rgba(245,158,11,0.25)] transition">
        <span x-text="currentIndex === activeList.length - 1 ? 'Finish Session' : 'Next Movement &rarr;'"></span>
      </button>
    </div>
  </main>

  <script>
    function mobilityApp() {
      return {
        mode: 'selector',
        activeTab: 'mobility', // <--- ADD THIS LINE
        headerTitle: 'Mobility Flow',
        currentIndex: 0,
        activeList: [],
        timerVal: 0,
        targetTimer: 0,
        timerRunning: false,
        timerInterval: null,
        wakeLock: null,

        routines: {

          // --- CALISTHENICS & SKILLS (MED PROTOCOL) ---
          skills_med_primary: {
            type: 'calisthenics',
            name: "Big 4 Calisthenics: Primary MED Session",
            duration: 40,
            exercises: [
              {
                branded_name: "Wrist & Scapular Activation Flow",
                biomechanical_name: "Radiocarpal Dynamic Mobilization & Scapular Protractions",
                category: "Prep Circuit",
                sets: 2, reps: 10, reps_unit: "reps per direction", hold_seconds: 0, rest_seconds: 30,
                starting_position: "All-fours quadruped with straight elbows.",
                movement_cues: [
                  "Perform 10 forward wrist rocks, 10 reverse palm lifts, and 10 scapular push-ups",
                  "Keep elbows strictly locked to isolate glenohumeral and serratus mechanics",
                  "Prepare forearms and connective tissue for heavy closed-chain loading"
                ],
                common_faults: ["Bending elbows", "Rushing through wrist extension"]
              },
              {
                branded_name: "Chest-to-Wall Handstand Alignment",
                biomechanical_name: "Static Inverted Glenohumeral Elevation Hold",
                category: "Skill Primer",
                sets: 3, reps: 1, reps_unit: "hold", hold_seconds: 30, rest_seconds: 60,
                starting_position: "Chest-to-wall handstand, hands 10–15 cm from wall.",
                movement_cues: [
                  "Actively shrug shoulders toward ears (scapular elevation)",
                  "Tuck pelvis into posterior tilt, engaging glutes and abdominals",
                  "Gaze softly between thumbs without arching cervical spine"
                ],
                common_faults: ["Banana back (lumbar lordosis)", "Depressing shoulders away from ears"]
              },
              {
                branded_name: "Pike HSPU / Wall Handstand Push-Up",
                biomechanical_name: "Overhead Inverted Pressing in Scapular Plane",
                category: "Pair A1 (Vertical Push)",
                sets: 3, reps: 3, reps_unit: "reps (RPE 9)", hold_seconds: 0, rest_seconds: 90,
                tempo: "3-1-X-0 (3s eccentric descent)",
                starting_position: "Hands shoulder-width, feet elevated on high box or wall.",
                movement_cues: [
                  "Lower head forward to form a clean tripod shape with hands",
                  "Keep elbows tucked at a 45-degree angle, not flared sideways",
                  "Drive aggressively back and through, finishing with shoulders shrugged to ears"
                ],
                common_faults: ["Flaring elbows out to 90 degrees", "Pressing straight up instead of pushing back through the window"]
              },
              {
                branded_name: "Archer Negative OAC / Assisted OAC",
                biomechanical_name: "Unilateral Eccentric Glenohumeral & Elbow Adduction",
                category: "Pair A2 (Vertical Pull)",
                sets: 3, reps: 2, reps_unit: "eccentrics per arm", hold_seconds: 2, rest_seconds: 90,
                tempo: "5s controlled eccentric + 2s pause at 90°",
                starting_position: "Pull-up bar with chin-up grip on working arm; assisting arm fingertips on bar/strap.",
                movement_cues: [
                  "Explode or jump to top chin-over-bar position",
                  "Lower over a strict 5-second countdown",
                  "Pause for 2 seconds at the sticking point (90 degrees elbow flexion) before full stretch"
                ],
                common_faults: ["Dropping fast through the bottom half", "Letting the working shoulder roll anteriorly forward"]
              },
              {
                branded_name: "Planche Lean Push-Up",
                biomechanical_name: "Anterior Deltoid & Serratus Leaned Horizontal Press",
                category: "Pair B1 (Horizontal Push)",
                sets: 3, reps: 5, reps_unit: "reps", hold_seconds: 3, rest_seconds: 90,
                tempo: "2s pause at peak forward lean",
                starting_position: "Push-up position with hands turned slightly outward (45°), leaning aggressively forward.",
                movement_cues: [
                  "Lean forward until hands are at waist/hip level with locked protraction",
                  "Descend into push-up keeping shoulders well forward of wrists",
                  "Push up to lockout and protract (push ceiling away), holding 2-3 seconds"
                ],
                common_faults: ["Losing protraction at top lockout", "Retracting hips backward during press"]
              },
              {
                branded_name: "Explosive Chest-to-Bar / False-Grip Pull",
                biomechanical_name: "High Dynamic Pull-Up with Muscle-Up Transition Mechanics",
                category: "Pair B2 (Horizontal/Vertical Pull)",
                sets: 3, reps: 4, reps_unit: "explosive reps", hold_seconds: 0, rest_seconds: 90,
                starting_position: "Overhand or false grip on straight bar or rings.",
                movement_cues: [
                  "Drive elbows straight back and down with maximum violent acceleration",
                  "Pull bar down to sternum/lower ribs, maintaining hollow body tension",
                  "Focus on concentric bar speed to build muscle-up turnover power"
                ],
                common_faults: ["Kicking knees up (kipping)", "Pulling chin only to bar level"]
              },
              {
                branded_name: "Hanging Leg Raise to Bar / L-Sit",

                movement_cues: [
                  "Engage lats, keep legs locked straight, and flex hips until toes touch the bar",
                  "Control the eccentric lowering phase with zero backward swing",
                  "Hold final rep or transition to 15s L-Sit hold"
                ],
                common_faults: ["Using swing momentum", "Bending knees"]
              },
              {
                branded_name: "Band / Ring Face Pulls",
                biomechanical_name: "Scapular Retraction & Glenohumeral External Rotation",
                category: "Rotator Cuff Prehab",
                sets: 2, reps: 12, reps_unit: "reps", hold_seconds: 1, rest_seconds: 60,
                starting_position: "Standing facing resistance band anchored at eye height.",
                movement_cues: [
                  "Pull band toward bridge of nose, driving elbows high and wide",
                  "Rotate forearms back into double-biceps position",
                  "Squeeze posterior deltoids and external rotators for 1 second"
                ],
                common_faults: ["Arching lumbar spine", "Leading with hands instead of elbows"]
              }
            ]
          },
          skills_med_secondary: {
            type: 'calisthenics',
            name: "Big 4 Calisthenics: Volume & Transition Day",
            duration: 35,
            exercises: [
              {
                branded_name: "Freestanding Handstand Practice",
                biomechanical_name: "Proprioceptive Balance & Micro-Adjustments",
                category: "Skill Practice",
                sets: 5, reps: 1, reps_unit: "attempts", hold_seconds: 20, rest_seconds: 45,
                starting_position: "Kick-up to freestanding handstand on floor or parallettes.",
                movement_cues: [
                  "Push tall through finger pads to control overthrow",
                  "Squeeze inner thighs together with pointed toes",
                  "Accumulate balance time with minimal fatigue"
                ],
                common_faults: ["Relaxing shoulders", "Kicking up too aggressively"]
              },
              {
                branded_name: "Assisted One-Arm Chin-Up",
                biomechanical_name: "Unilateral Concentric-Focused Vertical Pull",

                movement_cues: [

                ],
                common_faults: ["Cutting depth short", "Shoulders rounding forward excessively"]
              },
              {

                sets: 3, reps: 2, reps_unit: "eccentrics", hold_seconds: 2, rest_seconds: 90,
                starting_position: "Top of dip support over bar or rings.",
                movement_cues: [
                  "Lower to bottom dip and lean chest over bar",
                  "Maintain false grip as you slowly slide sternum past bar into hang",
                  "Spend 3–4 seconds specifically in the transition zone"
                ],
                common_faults: ["Losing false grip before reaching the hang", "Dropping through the turnaround"]
              },
              {
                branded_name: "Tuck Planche Hold / Lean Hold",
                biomechanical_name: "Straight-Arm Scapular Protraction Isometric",
                category: "Pair B2 (Static)",
                sets: 3, reps: 1, reps_unit: "hold", hold_seconds: 12, rest_seconds: 90,
                starting_position: "Parallettes or floor, shoulders pinned forward in extreme protraction.",
                movement_cues: [
                  "Depress and protract shoulder blades maximally (hollow chest)",
                  "Lock elbows completely straight (biceps facing forward)",
                  "Tuck knees to chest and elevate hips to shoulder height"
                ],
                common_faults: ["Bending elbows to bear weight", "Winged scapulae"]
              }
            ]
          },

          // --- FRONT SPLITS ---
          fs_a: {
            name: "Front Splits - Workout A",
            duration: 25,
            exercises: [
              {
                branded_name: "Walking Lunges",
                biomechanical_name: "Dynamic Alternating Forward Lunges",
                category: "Warm-Up",
                sets: 2, reps: 20, reps_unit: "total", hold_seconds: 0,
                starting_position: "Standing upright with feet hip-width apart and neutral pelvis.",
                movement_cues: ["Step forward into split stance, rear knee grazing floor", "Drive through front midfoot into next stride", "Keep torso stacked vertically"],
                common_faults: ["Excessive anterior pelvic tilt", "Knee valgus on lead leg"]
              },
              {
                branded_name: "Dynamic Front Kicks",
                biomechanical_name: "Standing Ballistic Hip Flexion",
                category: "Warm-Up",
                sets: 2, reps: 20, reps_unit: "per leg", hold_seconds: 0,
                starting_position: "Standing tall on one leg with light balance support.",
                movement_cues: ["Swing active leg forward/upward with locked knee", "Swing back naturally without forcing extension", "Keep torso upright"],

              },
              {
                branded_name: "Front to Back Pendulum",

                sets: 2, reps: 5, reps_unit: "per leg", hold_seconds: 0,

                movement_cues: ["Swing smoothly from full hip flexion to extension", "Keep core braced throughout arc", "Pelvis remains stable"],

              },
              {
                branded_name: "Front Foot Elevated Split Squat",
                biomechanical_name: "Deficit Split Squat with Front Foot Elevation",
                category: "Main Workout (A1)",
                sets: 2, reps: 10, reps_unit: "per leg", hold_seconds: 0,
                starting_position: "Lead foot on 5–10 cm plate/block; long stride back onto ball of rear foot.",
                movement_cues: ["Drive front knee over toes while dropping back hip", "Achieve full front hamstring-to-calf compression", "Squeeze trailing glute"],
                common_faults: ["Stance too short", "Rear knee bending early"]
              },
              {
                branded_name: "Single Leg GM B Stance",

                starting_position: "Working foot flat; kickstand foot placed half-foot behind with heel elevated.",
                movement_cues: ["Send working hip straight back with neutral spine", "Keep 90% weight on front leg", "Hold 10th rep for 10s at deepest hinge"],
                common_faults: ["Spine rounding", "Putting weight on rear kickstand"]
              },
              {
                branded_name: "Long Lunge Hold",
                biomechanical_name: "Active Isometric Terminal Hip Extension Hold",
                category: "Main Workout (B1)",
                sets: 3, reps: 1, reps_unit: "rep", hold_seconds: 30,
                starting_position: "Extended lunge stance with back knee elevated and heel driven back.",
                movement_cues: ["Tuck pelvis under (posterior tilt)", "Contract rear glute maximally", "Keep torso tall without arching low back"],
                common_faults: ["Sagging rear knee", "Excessive lumbar lordosis"]
              },
              {
                branded_name: "Front Split Sliders",
                biomechanical_name: "Eccentric-Concentric Front Split Sliding Transitions",
                category: "Main Workout (B2)",
                sets: 2, reps: 10, reps_unit: "per leg", hold_seconds: 10,
                starting_position: "Half-kneeling with front heel on slider disc, hands supported on blocks.",
                movement_cues: ["Slide heel out with eccentric hamstring control", "Pull heel back dynamically using hamstrings/adductors", "Hold 10th rep for 10s at end-range"],
                common_faults: ["Pelvis flaring open", "Passive collapse"]
              },
              {
                branded_name: "Reverse Lunge Sliders",
                biomechanical_name: "Rear-Foot Sliding Eccentric Split Squat",
                category: "Main Workout (C1)",
                sets: 2, reps: 10, reps_unit: "per leg", hold_seconds: 10,

                common_faults: ["Heel lifting", "Knee collapsing in"]
              },
              {
                branded_name: "Side Step Ups",
                biomechanical_name: "Frontal Plane Unilateral Step-Up",
                category: "Knees",
                sets: 2, reps: 10, reps_unit: "per leg", hold_seconds: 0,
                starting_position: "Standing next to box with inside foot flat on platform.",
                movement_cues: ["Drive straight down through elevated foot", "Do not jump off ground leg", "Lower over 2–3s tempo"],
                common_faults: ["Pushing off bottom foot", "Knee valgus on box"]
              }
            ]
          }
        },

        get filteredRoutines() {
          const list = {};
          for (const [k, v] of Object.entries(this.routines)) {
            // Defaults all your existing routines to 'mobility' unless specified as 'calisthenics'
            const rType = v.type || 'mobility';
            if (rType === this.activeTab) {
              list[k] = v;
            }
          }
          return list;
        },

        get currentEx() {
          return this.activeList[this.currentIndex] || {};
        },

        initApp() {
          if ('wakeLock' in navigator) {
            document.addEventListener('visibilitychange', async () => {
              if (this.mode === 'active' && document.visibilityState === 'visible') {
                this.requestWakeLock();
              }
            });
          }
        },

        async requestWakeLock() {
          try { this.wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
        },

        startRoutine(key) {
          this.activeList = this.routines[key].exercises;
          this.currentIndex = 0;
          this.mode = 'active';
          this.headerTitle = this.routines[key].name;
          this.setupExerciseTimer();
          this.requestWakeLock();
        },

        setupExerciseTimer() {
          this.resetTimer();
          this.targetTimer = this.currentEx.hold_seconds 
            ? this.currentEx.hold_seconds 
            : (this.currentEx.rest_seconds || 0);
          this.timerVal = this.targetTimer;
        },

        toggleTimer() {
          if (this.timerRunning) {
            clearInterval(this.timerInterval);
            this.timerRunning = false;
          } else {
            this.timerRunning = true;
            this.timerInterval = setInterval(() => {
              if (this.timerVal > 0) {
                this.timerVal--;
              } else {
                this.timerComplete();
              }
            }, 1000);
          }
        },

        resetTimer() {
          clearInterval(this.timerInterval);
          this.timerRunning = false;
          this.timerVal = this.targetTimer;
        },

        timerComplete() {
          clearInterval(this.timerInterval);
          this.timerRunning = false;
          this.playBeep();
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        },

        playBeep() {
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
            osc.start();
            osc.stop(ctx.currentTime + 0.4);
          } catch(e) {}
        },

        nextExercise() {
          if (this.currentIndex < this.activeList.length - 1) {
            this.currentIndex++;
            this.setupExerciseTimer();
          } else {
            this.exitWorkout();
          }
        },

        prevExercise() {
          if (this.currentIndex > 0) {
            this.currentIndex--;
            this.setupExerciseTimer();
          }
        },

        exitWorkout() {
          clearInterval(this.timerInterval);
          this.timerRunning = false;
          this.mode = 'selector';
          this.headerTitle = 'Mobility Flow';
          if (this.wakeLock) {
            this.wakeLock.release();
            this.wakeLock = null;
          }
        },

        formatTime(sec) {
          const m = Math.floor(sec / 60);
          const s = sec % 60;
          return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
      };
    }
  </script>
